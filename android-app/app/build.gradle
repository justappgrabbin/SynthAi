plugins {
    id 'com.android.application'
}

android {
    namespace 'app.synthai.computer'
    compileSdk 35

    defaultConfig {
        applicationId 'app.synthai.computer'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.4.0-a7'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    androidResources {
        noCompress += ['bundle']
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'org.apache.commons:commons-compress:1.27.1'
}
