name: Resident Mesh Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'computer/runtime/research-report-automaton.mjs'
      - 'computer/services/task-fit.mjs'
      - 'computer/services/task-fit-capability.mjs'
      - 'computer/tests/research-report-automaton.test.mjs'
      - 'computer/tests/research-report-cartridge-integration.test.mjs'
      - 'computer/tests/task-fit-native-convergence.test.mjs'
      - 'computer/tests/indiverse-addressed-registration.test.mjs'
      - 'computer/tests/cartridge-runtime-evidence.test.mjs'
      - 'computer/tests/working-system-promotion.test.mjs'
      - 'computer/native/NativeSeedRuntime.mjs'
      - 'computer/runtime/automata-cartridge-magazine.mjs'
      - '.github/workflows/resident-integration-check.yml'
  push:
    branches:
      - 'integration/synthia-reality-resident'
      - 'integration/synthia57-realm-morph-reskin-2026-09-24'
      - 'integration/echo-prime-resident-loaders'
      - 'integration/synthia58-automata-cartridge-loop'
      - 'recovery/research-report-automaton-v010-20260925'
      - 'recovery/taskfit-convergence-20260925'
      - 'recovery/indiverse-addressed-registration-20260925'
    paths:
      - 'computer/runtime/mesh-kernel.mjs'
      - 'computer/runtime/dormant-compiler.mjs'
      - 'computer/runtime/resident-host.mjs'
      - 'computer/runtime/automata-cartridge-magazine.mjs'
      - 'computer/runtime/research-report-automaton.mjs'
      - 'computer/residents/**'
      - 'computer/worlds/**'
      - 'computer/labs/**'
      - 'computer/services/purpose-guide.mjs'
      - 'computer/services/task-fit.mjs'
      - 'computer/services/task-fit-capability.mjs'
      - 'computer/mobile/MobileComputerRuntime.mjs'
      - 'computer/native/**'
      - 'computer/adapters/termux-compiler.mjs'
      - 'computer/tests/resident-*.test.mjs'
      - 'computer/tests/synthia57-*.test.mjs'
      - 'computer/tests/world-federation.test.mjs'
      - 'computer/tests/mesh-core-routing.test.mjs'
      - 'computer/tests/native-seed.test.mjs'
      - 'computer/tests/native-seed-server.test.mjs'
      - 'computer/tests/termux-compiler.test.mjs'
      - 'computer/tests/stellar-lab-mesh.test.mjs'
      - 'computer/tests/consciousness-realm-adapter.test.mjs'
      - 'computer/tests/human-agent-mechanics.test.mjs'
      - 'computer/tests/phone-world.test.mjs'
      - 'computer/tests/triform-mesh.test.mjs'
      - 'computer/tests/purpose-guide.test.mjs'
      - 'computer/tests/world-adapters.test.mjs'
      - 'computer/tests/research-report-automaton.test.mjs'
      - 'computer/tests/research-report-cartridge-integration.test.mjs'
      - 'computer/tests/task-fit-native-convergence.test.mjs'
      - '.github/workflows/resident-integration-check.yml'

permissions:
  contents: read

jobs:
  resident-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run resident stack contract tests
        run: >
          node --test
          computer/tests/mesh-core-routing.test.mjs
          computer/tests/native-seed.test.mjs
          computer/tests/native-seed-server.test.mjs
          computer/tests/termux-compiler.test.mjs
          computer/tests/stellar-lab-mesh.test.mjs
          computer/tests/consciousness-realm-adapter.test.mjs
          computer/tests/human-agent-mechanics.test.mjs
          computer/tests/phone-world.test.mjs
          computer/tests/triform-mesh.test.mjs
          computer/tests/purpose-guide.test.mjs
          computer/tests/world-adapters.test.mjs
          computer/tests/resident-mesh-indiverse.test.mjs
          computer/tests/native-resident-images.test.mjs
          computer/tests/automata-cartridge-magazine.test.mjs
          computer/tests/cartridge-runtime-evidence.test.mjs
          computer/tests/working-system-promotion.test.mjs
          computer/tests/research-report-automaton.test.mjs
          computer/tests/research-report-cartridge-integration.test.mjs
          computer/tests/task-fit-native-convergence.test.mjs
          computer/tests/indiverse-addressed-registration.test.mjs
          computer/tests/synthia57-resident.test.mjs
          computer/tests/synthia57-package-loader.test.mjs
          computer/tests/synthia57-package-store.test.mjs
          computer/tests/world-federation.test.mjs
