name: Synthia resident Node acceptance
on:
  push:
    branches:
      - integration/synthia-resident-dual-graph-20261025
      - integration/evidence-linked-kimi-donors-20261025
      - integration/synthia-real-dialogue-20261026
    paths:
      - 'computer/**'
      - '.github/workflows/synthia-resident-tests.yml'
  pull_request:
    paths:
      - 'computer/**'
      - '.github/workflows/synthia-resident-tests.yml'
  workflow_dispatch:
jobs:
  resident:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run local Synthia / Computer acceptance tests
        run: node --test computer/tests/synthia-resident.test.mjs computer/tests/kimi-donor-evidence.test.mjs computer/tests/grounded-dialogue.test.mjs computer/tests/local-language-learner.test.mjs computer/tests/runtime.test.mjs computer/tests/reassembly-ingest-e2e.test.mjs

      - name: Install desktop build dependencies
        run: npm --prefix computer/shell/kimi-linux ci --no-audit --no-fund
      - name: Typecheck and bundle real Computer desktop
        run: npm --prefix computer/shell/kimi-linux run build
