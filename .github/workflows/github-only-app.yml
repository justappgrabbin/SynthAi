name: Build GitHub-Only SynthAI App

on:
  push:
    branches:
      - integration/github-only-app-20260923
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and donor submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ephemeris runtime needed by existing tests
        run: python -m pip install --disable-pip-version-check ephem

      - name: Verify Computer runtime and stage browser app
        run: npm test

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 without obsolete tools package
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copy the verified repository app into Android assets
        run: |
          rm -rf android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/assets
          cp -R public/. android-app/app/src/main/assets/

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK boots the Computer runtime on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh

      - name: Record APK checksum
        run: |
          sha256sum android-app/app/build/outputs/apk/debug/app-debug.apk | tee android-app/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SynthAI-Computer-debug
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
