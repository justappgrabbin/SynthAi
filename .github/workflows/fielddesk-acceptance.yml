name: SYNTHIA FieldDesk user-facing app acceptance
on:
  push:
    branches: [integration/fielddesk-usable-app-20261027]
    paths:
      - public/fielddesk.html
      - public/index.html
      - computer/tests/fielddesk-acceptance.test.mjs
      - .github/workflows/fielddesk-acceptance.yml
  pull_request:
    paths:
      - public/fielddesk.html
      - public/index.html
      - computer/tests/fielddesk-acceptance.test.mjs
  workflow_dispatch:
jobs:
  original-klein-app:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify executable single-file FieldDesk with original ATO donor modules
        run: node --test computer/tests/fielddesk-acceptance.test.mjs
