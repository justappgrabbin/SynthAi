name: Synthia Computer Android checkpoint
on:
  workflow_dispatch:
  push:
    branches: [reassembly/computer-2026-09-29, integration/synthia-resident-dual-graph-20261025, integration/majiki-success-engine-20261103]
    paths: ['computer/**', '.github/workflows/computer-apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: sdkmanager 'platforms;android-35' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - run: npm --prefix computer/shell/kimi-linux ci && npm --prefix computer run build && npm --prefix computer run test:reassembly
      - name: Run Majiki autonomous loop acceptance tests
        run: node --test computer/tests/majiki-loop.test.mjs
      - run: python computer/android/prepare-assets.py
      - name: Stage Node 18 mobile runtime
        run: |
          curl -fL --retry 3 -o /tmp/node-mobile.zip 'https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip'
          echo 'bd7321eaa1a7602fbe0bb87302df2d79d87835cf4363fbdd17c350dbb485c2af  /tmp/node-mobile.zip' | sha256sum -c -
          python computer/android/prepare-node.py /tmp/node-mobile.zip
      - run: gradle -p computer/android :app:assembleDebug --stacktrace
      - name: Verify and prepare APK handoff
        run: |
          APK=computer/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" > /tmp/computer-apk-zip-check.txt
          sha256sum "$APK"
          stat -c 'APK bytes: %s' "$APK"
          mkdir -p /tmp/computer-apk-parts
          split -b 24m -d -a 2 "$APK" /tmp/computer-apk-parts/synthia-computer.apk.part-
      - uses: actions/upload-artifact@v4
        with:
          name: synthia-computer-android-debug
          path: computer/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: synthia-computer-apk-part-00
          path: /tmp/computer-apk-parts/synthia-computer.apk.part-00
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: synthia-computer-apk-part-01
          path: /tmp/computer-apk-parts/synthia-computer.apk.part-01
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: synthia-computer-apk-part-02
          path: /tmp/computer-apk-parts/synthia-computer.apk.part-02
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: synthia-computer-apk-part-03
          path: /tmp/computer-apk-parts/synthia-computer.apk.part-03
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: synthia-computer-apk-part-04
          path: /tmp/computer-apk-parts/synthia-computer.apk.part-04
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: synthia-computer-apk-part-05
          path: /tmp/computer-apk-parts/synthia-computer.apk.part-05
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: synthia-computer-apk-part-06
          path: /tmp/computer-apk-parts/synthia-computer.apk.part-06
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: synthia-computer-apk-part-07
          path: /tmp/computer-apk-parts/synthia-computer.apk.part-07
          if-no-files-found: warn

      - name: Confirm Majiki assets are packaged
        if: github.ref == 'refs/heads/integration/majiki-success-engine-20261103'
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from io import BytesIO
          apk = 'computer/android/app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(apk) as package:
              payload = package.read('assets/computer-assets.zip')
          with ZipFile(BytesIO(payload)) as assets:
              files = set(assets.namelist())
              required = [
                  'host/server.mjs',
                  'services/majiki-loop.mjs',
                  'shell/kimi-linux/dist/majiki.html',
              ]
              missing = [p for p in required if p not in files]
              if missing: raise SystemExit('Majiki APK is missing: ' + ', '.join(missing))
              print('Majiki embedded Node, persistent loop and front screen packaged')
          PY
      - name: Publish direct installable APK preview
        if: github.ref == 'refs/heads/integration/majiki-success-engine-20261103'
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "majiki-preview-\${GITHUB_RUN_ID}" \
            "computer/android/app/build/outputs/apk/debug/app-debug.apk#Majiki-Success-Engine-preview.apk" \
            --repo "\${GITHUB_REPOSITORY}" --target "\${GITHUB_SHA}" --prerelease \
            --title "Majiki Success Engine - Android preview \${GITHUB_RUN_NUMBER}" \
            --notes "Embedded local Node server, persistent task loop, verified non-destructive JSON repair outbox. Automated source and APK packaging checks passed. Physical-device Android testing, general coding autonomy, background survival, and update-key continuity are NOT yet verified. A preview debug signature may not update any existing org.synthai.computer installation. Preserve installed app data."
