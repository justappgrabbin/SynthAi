name: Prism keyboard APK and automatic release
on:
  push:
    branches: [prism-keys/android-auto-release]
    paths: ['prism-keyboard/**', '.github/workflows/prism-keyboard.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prism-keyboard-release
  cancel-in-progress: false
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore embedded Linux and stable debug signing key
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib
          root=Path('prism-keyboard')
          parts=root/'runtime/linux-parts'
          target=root/'android/app/src/main/assets/linux-rootfs.bundle'
          with target.open('wb') as output:
              for part in sorted(parts.glob('rootfs.part*')):
                  output.write(part.read_bytes())
          assert hashlib.sha256(target.read_bytes()).hexdigest()==(parts/'SHA256').read_text().strip()
          PYCODE
          mkdir -p ~/.android
          cp prism-keyboard/ci/debug.keystore ~/.android/debug.keystore
          python3 - <<'PYCODE'
          from pathlib import Path
          import os,re
          path=Path('prism-keyboard/android/app/build.gradle')
          path.write_text(re.sub(r'versionCode \d+', 'versionCode '+str(1000+int(os.environ['GITHUB_RUN_NUMBER'])),path.read_text()))
          PYCODE
      - name: Build Android APK
        run: gradle -p prism-keyboard/android assembleDebug
      - name: Preserve build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prism-Keys-ARM64-APK
          path: prism-keyboard/android/app/build/outputs/apk/debug/*.apk
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp prism-keyboard/android/app/build/outputs/apk/debug/app-debug.apk Prism-Keys.apk
          sha256sum Prism-Keys.apk > Prism-Keys.apk.sha256
          tag="prism-keys-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" Prism-Keys.apk Prism-Keys.apk.sha256 --target "$GITHUB_SHA" --title "Prism Keys build ${GITHUB_RUN_NUMBER}" --notes "ARM64 Android 8+ debug APK. Automatic build from ${GITHUB_SHA}. Not physically tested on a phone." --prerelease
