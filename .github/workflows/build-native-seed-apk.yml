name: Build SynthAI Native Seed APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'integration/synthia-reality-resident'
      - 'integration/indiverse-phone-world-convergence-2026-09-23'
    paths:
      - 'native-android/**'
      - 'computer/native/**'
      - 'computer/tests/phone-world.test.mjs'
      - 'computer/tests/mobile-phone-world-integration.test.mjs'
      - 'computer/tests/native-seed-server.test.mjs'
      - '.github/workflows/build-native-seed-apk.yml'

permissions:
  contents: read

jobs:
  build-native-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check native seed server syntax
        run: node --check computer/native/native-seed-server.mjs

      - name: Phone World acceptance
        run: |
          node --test computer/tests/phone-world.test.mjs
          node --test computer/tests/mobile-phone-world-integration.test.mjs
          node --test computer/tests/native-seed-server.test.mjs

      - name: Verify native Phone World sources
        run: |
          test -f native-android/app/src/main/java/org/synthai/computer/WorldObservationService.java
          test -f native-android/app/src/main/res/xml/world_observation_service.xml
          grep -q 'WorldObservationService' native-android/app/src/main/AndroidManifest.xml
          grep -q "app.observe" computer/native/native-seed-server.mjs

      - name: Build native debug APK
        run: gradle -p native-android :app:assembleDebug --stacktrace

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: synthai-native-seed-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
