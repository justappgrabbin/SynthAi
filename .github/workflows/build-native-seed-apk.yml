name: Build SynthAI Native Seed APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'integration/synthia-reality-resident'
    paths:
      - 'native-android/**'
      - 'computer/native/**'
      - '.github/workflows/build-native-seed-apk.yml'

permissions:
  contents: read

jobs:
  build-native-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check native seed server syntax
        run: node --check computer/native/native-seed-server.mjs

      - name: Build native debug APK
        run: gradle -p native-android :app:assembleDebug --stacktrace

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: synthai-native-seed-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
