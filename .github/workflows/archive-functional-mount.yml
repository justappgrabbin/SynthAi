name: SYNTH AI source integration acceptance
on:
  push:
    branches: [integration/archive-functional-mount-20261027]
    paths:
      - 'computer/services/browser-archive-connector.mjs'
      - 'computer/tests/archive-integration.test.mjs'
      - 'computer/build-web.mjs'
      - 'public/workspace.mjs'
      - 'public/workspace.html'
      - '.github/workflows/archive-functional-mount.yml'
  pull_request:
    paths:
      - 'computer/services/browser-archive-connector.mjs'
      - 'computer/tests/archive-integration.test.mjs'
      - 'computer/build-web.mjs'
      - 'public/workspace.mjs'
      - 'public/workspace.html'
  workflow_dispatch:
jobs:
  archive-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check public/workspace.mjs
          node --check computer/services/browser-archive-connector.mjs
      - name: Real Computer source mounts and original Klein engines
        run: node --test computer/tests/archive-integration.test.mjs
      - name: Build web with original resident and donor dependencies
        run: |
          node computer/build-web.mjs
          test -f public/computer-runtime/services/synthia-resident.mjs
          test -f public/computer-runtime/services/browser-archive-connector.mjs
          test -f public/computer-runtime/engines/unified-execution-spine/src/pure-synthia/merged/tool-factory.js
          test -f public/computer-runtime/engines/unified-execution-spine/src/pure-synthia/automata/tools/tool-14-autoling.js
