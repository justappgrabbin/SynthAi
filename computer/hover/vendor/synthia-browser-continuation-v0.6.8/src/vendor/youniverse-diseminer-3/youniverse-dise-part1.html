<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>YOU-N-I-VERSE — DISEMINER Living Mirror</title>
  <style>
    :root {
      --bg: #050505; --bg-panel: #0a0a0a; --bg-card: #111111; --bg-input: #1a1a1a;
      --border: #1a1a1a; --border-hover: #2a2a2a;
      --text: #e8e8e8; --text-dim: #666666;
      --accent: #9fd5ff; --accent-warm: #ffd59f;
      --accent-body: #64b5f6; --accent-mind: #ffd54f; --accent-action: #ff7043;
      --gold: #ffd700;
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }

    .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }

    .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 1rem; background: var(--bg-panel); border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 100; }
    .top-bar .logo { font-size: 0.9rem; color: var(--accent); font-weight: 600; letter-spacing: 0.05em; }
    .top-bar .logo span { color: var(--text-dim); font-weight: 400; }
    .top-bar .profile-badge { font-size: 0.7rem; color: var(--text-dim); background: var(--bg-card); padding: 0.3rem 0.6rem; border-radius: 20px; border: 1px solid var(--border); cursor: pointer; }

    .tab-strip { display: flex; gap: 0; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; background: var(--bg-panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .tab-strip::-webkit-scrollbar { display: none; }
    .tab { flex: 0 0 auto; padding: 0.7rem 1.2rem; font-size: 0.8rem; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; user-select: none; -webkit-user-select: none; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab:active { opacity: 0.6; }

    .content { flex: 1; overflow: hidden; position: relative; }
    .tab-content { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: none; }
    .tab-content.active { display: block; }

    /* ===== 3D CANVAS ===== */
    #three-canvas { width: 100%; height: 100%; display: block; }
    .three-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 1rem; background: linear-gradient(transparent, rgba(0,0,0,0.85)); pointer-events: none; z-index: 10; }
    .three-overlay .field-name { color: var(--gold); font-size: 1.1rem; font-weight: 600; }
    .three-overlay .field-desc { color: var(--text-dim); font-size: 0.8rem; margin-top: 0.3rem; }

    .body-toggle { position: absolute; top: 1rem; left: 50%; transform: translateX(-50%); display: flex; gap: 0.5rem; z-index: 20; pointer-events: auto; }
    .body-toggle-btn { padding: 0.5rem 1rem; border-radius: 20px; border: 1px solid var(--border); background: rgba(10,10,10,0.8); color: var(--text-dim); font-size: 0.75rem; cursor: pointer; transition: all 0.2s; backdrop-filter: blur(4px); }
    .body-toggle-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(159,213,255,0.1); }
    .body-toggle-btn.action.active { border-color: var(--accent-action); color: var(--accent-action); }
    .body-toggle-btn.mind.active { border-color: var(--accent-mind); color: var(--accent-mind); }
    .body-toggle-btn.emotion.active { border-color: var(--accent-body); color: var(--accent-body); }

    .three-controls { position: absolute; top: 1rem; right: 1rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 20; pointer-events: auto; }
    .three-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(10,10,10,0.8); border: 1px solid var(--border); color: var(--text); font-size: 1.1rem; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(4px); transition: all 0.2s; }
    .three-btn:active { background: rgba(255,255,255,0.1); }

    .auryn-panel { position: absolute; bottom: 5rem; right: 1rem; width: 280px; background: rgba(10,10,10,0.9); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; z-index: 20; backdrop-filter: blur(10px); display: none; }
    .auryn-panel.active { display: block; }
    .auryn-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem; }
    .auryn-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #14b8a6, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 1rem; }
    .auryn-name { font-size: 0.85rem; font-weight: 600; color: var(--accent); }
    .auryn-status { font-size: 0.65rem; color: var(--text-dim); }
    .auryn-convo { max-height: 200px; overflow-y: auto; margin-bottom: 0.8rem; }
    .auryn-msg { padding: 0.5rem; border-radius: 8px; margin-bottom: 0.4rem; font-size: 0.75rem; line-height: 1.4; }
    .auryn-msg.auryn { background: rgba(159,213,255,0.08); border-left: 2px solid var(--accent); }
    .auryn-msg.user { background: rgba(255,255,255,0.05); text-align: right; }
    .auryn-input-row { display: flex; gap: 0.4rem; }
    .auryn-input { flex: 1; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 0.4rem 0.6rem; color: var(--text); font-size: 0.8rem; outline: none; }
    .auryn-send { padding: 0.4rem 0.8rem; background: var(--accent); color: #000; border: none; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }

    /* ===== CHAT ===== */
    .chat-messages { display: flex; flex-direction: column; gap: 0.6rem; padding: 0.8rem; padding-bottom: 5rem; min-height: 100%; }
    .msg { max-width: 85%; padding: 0.7rem 0.9rem; border-radius: 14px; font-size: 0.85rem; line-height: 1.5; animation: msgIn 0.3s ease; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(10px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .msg-user { align-self: flex-end; background: #1a2a3a; border: 1px solid #2a4a6a; color: var(--accent); border-bottom-right-radius: 4px; }
    .msg-system { align-self: flex-start; background: var(--bg-card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg-artifact { align-self: flex-start; background: #1a1a0a; border: 1px solid #3a3a1a; color: var(--accent-warm); border-bottom-left-radius: 4px; }
    .msg-meta { font-size: 0.65rem; color: var(--text-dim); margin-top: 0.3rem; opacity: 0.7; }
    .msg-dise { align-self: flex-start; background: #0a1a2a; border: 1px solid #1a3a5a; color: #7ec8e3; border-bottom-left-radius: 4px; font-size: 0.75rem; }
    .msg-dise pre { font-family: var(--font); white-space: pre-wrap; margin: 0; }

    .chat-input-wrap { position: fixed; bottom: 0; left: 0; right: 0; padding: 0.5rem 0.8rem calc(0.5rem + var(--safe-bottom)); background: var(--bg-panel); border-top: 1px solid var(--border); display: flex; gap: 0.5rem; z-index: 90; }
    .chat-input { flex: 1; background: var(--bg-input); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-size: 0.9rem; padding: 0.6rem 1rem; outline: none; -webkit-appearance: none; }
    .chat-input:focus { border-color: var(--accent); }
    .chat-send { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #000; border: none; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform 0.1s; }
    .chat-send:active { transform: scale(0.9); }

    /* ===== WRITE ===== */
    .write-editor { width: 100%; height: calc(100% - 50px); background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; color: var(--text); font-size: 0.9rem; line-height: 1.6; resize: none; outline: none; -webkit-appearance: none; }
    .write-toolbar { display: flex; gap: 0.5rem; padding: 0.8rem; padding-bottom: 0.5rem; }
    .write-toolbar button { padding: 0.4rem 0.8rem; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-dim); border-radius: 6px; cursor: pointer; font-size: 0.75rem; -webkit-appearance: none; }

    /* ===== SKETCH ===== */
    .sketch-container { display: flex; flex-direction: column; height: 100%; gap: 0.5rem; padding: 0.8rem; }
    .sketch-canvas { flex: 1; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; touch-action: none; cursor: crosshair; }
    .sketch-tools { display: flex; gap: 0.5rem; align-items: center; padding: 0.3rem 0; overflow-x: auto; scrollbar-width: none; }
    .sketch-tools::-webkit-scrollbar { display: none; }
    .sketch-tools button { padding: 0.4rem 0.8rem; background: var(--bg-card); border: 1px solid var(--border); color: var(--text); border-radius: 6px; cursor: pointer; font-size: 0.75rem; flex-shrink: 0; -webkit-appearance: none; }
    .sketch-tools .color-picker { width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 50%; cursor: pointer; padding: 0; flex-shrink: 0; -webkit-appearance: none; }

    /* ===== PORTS ===== */
    .ports-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; padding: 0.8rem; }
    @media (min-width: 400px) { .ports-grid { grid-template-columns: repeat(3, 1fr); } }
    .port-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem; cursor: pointer; transition: all 0.2s; }
    .port-card:active { transform: scale(0.97); }
    .port-num { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; }
    .port-name { font-size: 0.95rem; color: var(--accent); margin: 0.2rem 0; }
    .port-desc { font-size: 0.7rem; color: var(--text-dim); }

    /* ===== DISEMINER ===== */
    .diseminer-panel { display: flex; flex-direction: column; height: 100%; padding: 0.8rem; gap: 0.8rem; overflow-y: auto; }
    .diseminer-header { text-align: center; padding: 0.8rem 0; border-bottom: 1px solid var(--border); }
    .diseminer-title { font-size: 1.1rem; color: var(--accent); font-weight: 600; }
    .diseminer-subtitle { font-size: 0.7rem; color: var(--text-dim); margin-top: 0.2rem; }
    .diseminer-query { display: flex; gap: 0.5rem; }
    .diseminer-input { flex: 1; background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem 0.8rem; color: var(--text); font-size: 0.85rem; outline: none; }
    .diseminer-run { padding: 0.6rem 1rem; background: var(--accent); color: #000; border: none; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .diseminer-results { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem; min-height: 80px; font-size: 0.8rem; line-height: 1.5; }
    .diseminer-results .narrative { color: var(--text); margin-bottom: 0.5rem; white-space: pre-wrap; }
    .diseminer-results .meta { color: var(--text-dim); font-size: 0.7rem; }
    .diseminer-results .artifact { color: var(--accent-warm); margin-top: 0.5rem; padding: 0.5rem; background: rgba(255,213,159,0.05); border-radius: 6px; }
    .diseminer-viz { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; min-height: 160px; position: relative; }
    .diseminer-viz canvas { width: 100%; height: 160px; display: block; }
    .diseminer-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .diseminer-stat { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem; text-align: center; }
    .diseminer-stat-label { font-size: 0.6rem; color: var(--text-dim); text-transform: uppercase; }
    .diseminer-stat-value { font-size: 0.95rem; color: var(--accent); font-weight: 600; margin-top: 0.15rem; }
    .diseminer-traj { display: flex; align-items: flex-end; gap: 3px; height: 40px; padding: 0.5rem 0; }
    .diseminer-traj-bar { width: 10px; border-radius: 2px 2px 0 0; transition: height 0.3s ease; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 200; padding: 1rem; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; max-width: 400px; width: 100%; max-height: 80vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .modal h3 { color: var(--accent); font-size: 1.1rem; margin-bottom: 0.5rem; }
    .modal p { color: var(--text-dim); font-size: 0.85rem; line-height: 1.5; }
    .modal .modal-close { width: 100%; padding: 0.7rem; background: var(--accent); color: #000; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; margin-top: 1rem; }

    .profile-form label { display: block; font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; margin: 0.8rem 0 0.3rem; }
    .profile-form input, .profile-form select { width: 100%; padding: 0.6rem; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.9rem; -webkit-appearance: none; }

    .install-banner { position: fixed; top: 0; left: 0; right: 0; background: var(--bg-panel); border-bottom: 1px solid var(--accent); padding: 0.6rem 1rem; display: none; align-items: center; justify-content: space-between; z-index: 150; }
    .install-banner.active { display: flex; }
    .install-banner span { font-size: 0.8rem; color: var(--accent); }
    .install-banner button { padding: 0.3rem 0.8rem; background: var(--accent); color: #000; border: none; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    .install-banner .dismiss { background: transparent; color: var(--text-dim); border: 1px solid var(--border); margin-left: 0.5rem; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
