<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synthia</title>
<style>
  @font-face { font-family: 'ui-mono'; src: local('JetBrains Mono'), local('Menlo'), local('Consolas'); }
  :root{
    --bg:#0b0d0c; --panel:#111412; --line:#22261f; --ink:#dfe6da; --dim:#7c8a76;
    --gate:#c98a3c; --ok:#7fae66; --err:#b85c4a; --accent:#9fb88a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font: 15px/1.5 ui-mono, 'JetBrains Mono', Menlo, Consolas, monospace;
    display:flex; flex-direction:column;
  }
  header{
    padding:18px 22px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  header .mark{ font-size:20px; letter-spacing:0.14em; color:var(--accent); }
  header .mark b{ color:var(--gate); }
  header .sub{ color:var(--dim); font-size:12px; letter-spacing:0.04em; }
  #diag{ margin-left:auto; font-size:12px; color:var(--dim); display:flex; gap:10px; }
  #diag span{ padding:2px 8px; border:1px solid var(--line); border-radius:3px; }
  #diag span.ok{ color:var(--ok); border-color:#2c3a26; }
  #diag span.bad{ color:var(--err); border-color:#3a2622; }

  main{ flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:16px; }
  .turn{ max-width:820px; }
  .turn .who{ font-size:11px; letter-spacing:0.12em; color:var(--dim); margin-bottom:4px; }
  .turn.user .who{ color:var(--accent); }
  .turn .bubble{ white-space:pre-wrap; }
  .turn.synthia .bubble{ color:var(--ink); }
  .meta{
    margin-top:8px; font-size:12px; color:var(--dim); border-left:2px solid var(--line);
    padding-left:10px; display:flex; flex-direction:column; gap:3px;
  }
  .meta b{ color:var(--gate); font-weight:600; }
  .tag{ display:inline-block; padding:1px 6px; margin-right:6px; border:1px solid var(--line); border-radius:3px; font-size:11px; }

  form{
    display:flex; gap:10px; padding:16px 22px; border-top:1px solid var(--line); background:var(--panel);
  }
  input{
    flex:1; background:#0b0d0c; border:1px solid var(--line); color:var(--ink);
    padding:10px 12px; font: inherit; border-radius:4px; outline:none;
  }
  input:focus{ border-color:var(--accent); }
  button{
    background:var(--gate); color:#171308; border:none; padding:10px 18px;
    font:inherit; font-weight:600; letter-spacing:0.03em; border-radius:4px; cursor:pointer;
  }
  button:hover{ filter:brightness(1.08); }
  button:disabled{ opacity:0.5; cursor:default; }
  ::selection{ background:#3a4a30; }
</style>
</head>
<body>
  <header>
    <div class="mark">SYNTH<b>I</b>A</div>
    <div class="sub">one runtime · every piece ingested · nothing thrown away</div>
    <div id="diag">booting…</div>
  </header>

  <main id="log"></main>

  <form id="form">
    <input id="input" autocomplete="off" placeholder="say something to Synthia…" />
    <button id="send" type="submit">send</button>
  </form>

<script type="module">
  import { createSynthia } from './synthia.mjs';

  const log = document.getElementById('log');
  const diagEl = document.getElementById('diag');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  function addTurn(who, text) {
    const div = document.createElement('div');
    div.className = `turn ${who}`;
    div.innerHTML = `<div class="who">${who}</div><div class="bubble"></div>`;
    div.querySelector('.bubble').textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function addMeta(container, reply) {
    const meta = document.createElement('div');
    meta.className = 'meta';
    const engines = (reply.engines || []).map(e => `<span class="tag">${e}</span>`).join('');
    meta.innerHTML += `<div>${engines || '<span class="tag">no engine matched</span>'}</div>`;
    if (reply.semantics) meta.innerHTML += `<div><b>reading:</b> ${escapeHtml(reply.semantics.corrected ?? '')} <span style="color:var(--dim)">(confidence ${(reply.semantics.confidence ?? 0).toFixed(2)})</span></div>`;
    if (reply.routing) meta.innerHTML += `<div><b>dimension:</b> ${reply.routing.status}${reply.routing.dimension ? ' → ' + reply.routing.dimension : ''}</div>`;
    if (reply.tool) meta.innerHTML += `<div><b>spawned tool:</b> ${reply.tool.structure?.name ?? ''} <span style="color:var(--dim)">(${reply.tool.functionalLevel}, gate-addressed)</span></div>`;
    if (reply.note) meta.innerHTML += `<div>${reply.note}</div>`;
    container.appendChild(meta);
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  addTurn('synthia', 'booting…');

  const synthia = await createSynthia();
  const diag = synthia.diagnostics();
  log.innerHTML = '';
  diagEl.innerHTML = ['disseminer','autoling','toolFactory'].map(k =>
    `<span class="${diag[k] ? 'ok' : 'bad'}">${k}${diag[k] ? '' : ' ✗'}</span>`
  ).join('') + `<span>${diag.resolverModules} modules resolved</span>`;

  addTurn('synthia', "I'm up. Every piece from every upgrade you sent is loaded or reachable through the resolver. Say something.");

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    sendBtn.disabled = true;
    addTurn('user', text);
    const thinking = addTurn('synthia', '…');
    try {
      const reply = await synthia.chat(text);
      thinking.querySelector('.bubble').textContent = reply.semantics?.corrected || reply.note || '(processed)';
      addMeta(thinking, reply);
    } catch (err) {
      thinking.querySelector('.bubble').textContent = '(error, still alive): ' + err.message;
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
