<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Synthia Morph Reskin — Offline Demo</title>
<style>html,body{margin:0;height:100%;background:#050508;color:#ddd;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.wrap{width:min(92vw,620px)}canvas{display:block;width:min(72vw,320px);height:auto;margin:18px auto;background:radial-gradient(circle at 50% 65%,#181224,#08070d 65%);border:1px solid #2b2240;border-radius:18px}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button,label{background:#11111a;border:1px solid #302747;color:#ccc;border-radius:9px;padding:8px 11px;font-size:12px}button.on{border-color:#a855f7;color:#d8b4fe}.title{text-align:center;font-size:13px;letter-spacing:.18em;color:#c084fc}.sub{text-align:center;color:#777;font-size:11px;margin-top:5px}.status{text-align:center;color:#666;font:10px monospace;margin-top:12px}input{display:none}</style>
<script src="/morph/runtime/morph-engine.js"></script><script src="/morph/runtime/sprite-runtime.classic.js"></script></head><body><div class="wrap"><div class="title">SYNTHIA · MORPH RESKIN</div><div class="sub">surface rig underneath · replaceable sprite skin on top</div><canvas id="c" width="256" height="320"></canvas><div class="row"><button data-s="idle" class="on">IDLE</button><button data-s="walk">WALK</button><button data-s="talk">TALK</button><button data-s="express">EXPRESS</button><label>LOAD SPRITE SHEET<input id="file" type="file" accept="image/*"></label></div><div class="status" id="status">building surface-completed walk cycle…</div></div>
<script>
(function(){const C=document.getElementById('c'),ctx=C.getContext('2d'),SR=SynthiaSpriteRuntime,ML=MorphEngineLib;let bitmap=null,frames=[],mode='idle',time=0,last=performance.now();const clone=s=>Object.fromEntries(Object.entries(s).map(([k,v])=>[k,[v[0],v[1]]]));function rot(a,p,z){const x=p[0]-a[0],y=p[1]-a[1],c=Math.cos(z),s=Math.sin(z);return[a[0]+x*c-y*s,a[1]+x*s+y*c]}function chain(L,a,b,c,u,lower){const B=rot(L[a],L[b],u),fv=[L[c][0]-L[b][0],L[c][1]-L[b][1]],C2=rot(B,[B[0]+fv[0],B[1]+fv[1]],u+lower);L[b]=B;L[c]=C2}function pose(p){const l=clone(ML.poseIdle()),s=Math.sin(p*Math.PI*2),q=Math.cos(p*Math.PI*2);chain(l,'shoulder_l','elbow_l','wrist_l',.5*s,.06*q);chain(l,'shoulder_r','elbow_r','wrist_r',-.5*s,-.06*q);chain(l,'hip_l','knee_l','ankle_l',-.46*s,.16*Math.max(0,-q));chain(l,'hip_r','knee_r','ankle_r',.46*s,.16*Math.max(0,q));l.hair[0]+=s*3;l.skirt_l[0]-=s*4;l.skirt_r[0]-=s*3;return l}function build(){const can=ML.renderCharacter(ML.poseIdle(),'demo'),atlas=ML.extractAtlas(can),n=8,s=document.createElement('canvas');s.width=ML.W*n;s.height=ML.H;const x=s.getContext('2d');for(let i=0;i<n;i++)x.drawImage(ML.reconstruct(atlas,pose(i/n),ML.W,ML.H).canvas,i*ML.W,0);bitmap=s;frames=SR.sliceSheet(s,{cols:n,rows:1,frameWidth:ML.W,frameHeight:ML.H});document.getElementById('status').textContent='SURFACE MORPH · 8 frames · offline';}build();document.querySelectorAll('button[data-s]').forEach(b=>b.onclick=()=>{mode=b.dataset.s;document.querySelectorAll('button[data-s]').forEach(x=>x.classList.toggle('on',x===b))});document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;bitmap=await SR.loadBitmap(f);const g=SR.inferGrid(bitmap.width,bitmap.height,0);frames=SR.sliceSheet(bitmap,g);document.getElementById('status').textContent=`${f.name} · ${g.cols}×${g.rows} · ${frames.length} frames`;};window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='synthia:realm-state')return;if(['idle','walk','talk','express'].includes(e.data.mode))mode=e.data.mode});function loop(now){const dt=(now-last)/1000;last=now;time+=dt;ctx.clearRect(0,0,C.width,C.height);const n=Math.max(1,frames.length),speed=mode==='walk'?8:mode==='talk'?2.5:mode==='express'?1.3:.35,r=(time*speed)%n,i=Math.floor(r)%n,j=(i+1)%n,t=r-Math.floor(r),a=frames[i],b=frames[j];SR.drawInterpolated(ctx,bitmap,a,b,t,0,0,{width:C.width,height:C.height,time,phase:r/n,walk:mode==='walk'?1:0,talk:mode==='talk'?1:0,express:mode==='express'?1:0});requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>
