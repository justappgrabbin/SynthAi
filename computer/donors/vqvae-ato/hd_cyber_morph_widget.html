    function toggleCenter(btn) {
      btn.classList.toggle('active');

    function getDefinedCenters() {
      return Array.from(document.querySelectorAll('#centerToggles .active')).map(b => b.dataset.center);
    }

    function parseGates(input) {
      if (!input.trim()) return [];
      return input.split(',').map(s => {
        const [num, line] = s.trim().split('.');
        return { number: parseInt(num), line: parseInt(line) || 1 };
      }).filter(g => g.number >= 1 && g.number <= 64);
    }

    function getLineExpr(line) {
      const expr = ['Investigation/Foundation','Projection/Calling','Trial & Error/Adaptation','Externalization/Influence','Universalization/Heresy','Role Model/Transcendence'];
      return expr[line-1] || 'Unknown';
    }

    function generateMorph() {
      const type = document.getElementById('hdType').value;
      const profile = document.getElementById('hdProfile').value;
      const authority = document.getElementById('hdAuthority').value;
      const defined = getDefinedCenters();
      const allCenters = ['Head','Ajna','Throat','G','Heart','SolarPlexus','Sacral','Spleen','Root'];
      const undefined = allCenters.filter(c => !defined.includes(c));
      const gates = parseGates(document.getElementById('hdGates').value);
      const cross = document.getElementById('hdCross').value;

      const typeData = TYPE_ARCHETYPE[type];
      const authData = AUTH_PALETTE[authority];
      const profData = PROFILE_STANCE[profile] || PROFILE_STANCE['1_4'];

      // Build spec

        type, profile, authority, defined, undefined, gates, cross,
        archetype: typeData.archetype,
        faction: typeData.faction,
        threat: typeData.threat,
        frame: typeData.frame,
        stance: profData.stance,
        pose: profData.pose,
        detail: profData.detail,
        primary: authData.primary,
        secondary: authData.secondary,
        glow: authData.glow,
        pulse: authData.pulse
      };
      currentSpec = spec;

      // Render
      renderCanvas(spec);
      renderSpec(spec);

    function renderCanvas(spec) {
      const canvas = document.getElementById('morphCanvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width || 500;
      const h = canvas.height || 600;

      if (!currentImage) {
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, w, h);
        // Draw face outline
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(w/2, h/2, w*0.25, h*0.35, 0, 0, Math.PI*2);
        ctx.stroke();
        // Eyes
        ctx.beginPath();
        ctx.ellipse(w/2 - w*0.08, h/2 - h*0.05, w*0.04, h*0.03, 0, 0, Math.PI*2);
        ctx.ellipse(w/2 + w*0.08, h/2 - h*0.05, w*0.04, h*0.03, 0, 0, Math.PI*2);
        ctx.stroke();
      } else {
        ctx.drawImage(currentImage, 0, 0, w, h);
      }

      // Apply overlays
      const [pr, pg, pb] = spec.primary;
      const [gr, gg, gb] = spec.glow;

      // Authority glow
      const authC = AUTH_CENTER[spec.authority];
      const [ax, ay] = CENTER_POS[authC] || [0.5, 0.5];
      drawGlow(ctx, ax*w, ay*h, w*0.15, [gr, gg, gb], 0.7);

      // Defined centers
      for (const center of spec.defined) {
        const [cx, cy] = CENTER_POS[center] || [0.5, 0.5];
        const cov = center === 'Sacral' ? 0.9 : center === 'Heart' ? 0.7 : 0.5;
        drawImplant(ctx, cx*w, cy*h, w*0.08*cov, [pr, pg, pb], 0.8, center);
      }

      // Open centers (wiring)
      for (const center of spec.undefined) {
        const [cx, cy] = CENTER_POS[center] || [0.5, 0.5];
        drawWiring(ctx, cx*w, cy*h, w*0.06, [80, 80, 80], 0.4);
      }

      // Gate implants
      for (const gate of spec.gates) {
        const gData = GATE_MAP[gate.number];
        if (!gData) continue;
        const circuit = GATE_CIRCUIT[gate.number] || 'Individual';
        const color = CIRCUIT_COLOR[circuit];
        const [gx, gy] = LOC_POS[gData.loc] || [0.5, 0.5];
        const intensity = gate.line / 6;
        drawGateImplant(ctx, gx*w, gy*h, w*0.04, color, intensity, gate.number, gData.name);
      }

      // Eye modification
      const eyeColors = {
        Manifestor: [255,80,60], Generator: [0,255,200], ManifestingGenerator: [255,200,0],
        Projector: [180,80,255], Reflector: [200,200,220]
      };
      const eyeColor = eyeColors[spec.type] || [255,255,255];
      drawEye(ctx, w/2 - w*0.12, h/2 - h*0.08, w*0.06, eyeColor, 0.9);
      drawEye(ctx, w/2 + w*0.12, h/2 - h*0.08, w*0.06, eyeColor, 0.9);

      // Type-specific frame overlay
      drawFrameOverlay(ctx, spec, w, h);

      // Color grade
      ctx.save();
      ctx.globalCompositeOperation = 'overlay';
      ctx.globalAlpha = 0.12;
      ctx.fillStyle = `rgb(${pr},${pg},${pb})`;
      ctx.fillRect(0, 0, w, h);
      ctx.restore();

      // Vignette
      const vig = ctx.createRadialGradient(w/2, h/2, w*0.25, w/2, h/2, w*0.7);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,0.5)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, w, h);
    }

    function drawGlow(ctx, x, y, r, color, intensity) {
      ctx.save();
      ctx.globalAlpha = intensity * 0.5;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${color[0]},${color[1]},${color[2]},0.8)`);
      g.addColorStop(0.5, `rgba(${color[0]},${color[1]},${color[2]},0.2)`);
      g.addColorStop(1, `rgba(${color[0]},${color[1]},${color[2]},0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    function drawImplant(ctx, x, y, r, color, intensity, label) {
      ctx.save();
      ctx.globalAlpha = intensity * 0.6;
      // Core
      ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},0.7)`;
      ctx.beginPath();
      ctx.arc(x, y, r*0.3, 0, Math.PI*2);
      ctx.fill();
      // Ring
      ctx.strokeStyle = `rgba(${color[0]},${color[1]},${color[2]},0.9)`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, r*0.5, 0, Math.PI*2);
      ctx.stroke();
      // Tech marks
      ctx.strokeStyle = `rgba(${color[0]},${color[1]},${color[2]},0.5)`;
      ctx.lineWidth = 1;
      for (let i = 0; i < 4; i++) {
        const a = (i/4) * Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a)*r*0.5, y + Math.sin(a)*r*0.5);
        ctx.lineTo(x + Math.cos(a)*r*0.8, y + Math.sin(a)*r*0.8);
        ctx.stroke();
      }
      // Label
      ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},0.9)`;
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(label, x, y - r - 4);
      ctx.restore();
    }

    function drawWiring(ctx, x, y, r, color, intensity) {
      ctx.save();
      ctx.globalAlpha = intensity;
      ctx.strokeStyle = `rgba(${color[0]},${color[1]},${color[2]},0.6)`;
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI*2);
      ctx.stroke();
      // Exposed wires
      for (let i = 0; i < 3; i++) {
        const a = (i/3) * Math.PI*2 + Math.random();
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a)*r, y + Math.sin(a)*r);
        ctx.lineTo(x + Math.cos(a)*r*1.5, y + Math.sin(a)*r*1.5);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.restore();
    }

    function drawGateImplant(ctx, x, y, r, color, intensity, num, name) {
      ctx.save();
      ctx.globalAlpha = intensity * 0.7;
      // Hex shape
      ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},0.5)`;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i/6) * Math.PI*2 - Math.PI/6;
        const px = x + Math.cos(a) * r;
        const py = y + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = `rgba(${color[0]},${color[1]},${color[2]},0.9)`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // Gate number
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(num, x, y);
      ctx.restore();
    }

    function drawEye(ctx, x, y, r, color, intensity) {
      ctx.save();
      ctx.globalAlpha = intensity;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r*2);
      g.addColorStop(0, `rgba(${color[0]},${color[1]},${color[2]},0.9)`);
      g.addColorStop(0.5, `rgba(${color[0]},${color[1]},${color[2]},0.3)`);
      g.addColorStop(1, `rgba(${color[0]},${color[1]},${color[2]},0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r*2, 0, Math.PI*2);
      ctx.fill();
      // Iris ring
      ctx.strokeStyle = `rgba(${color[0]},${color[1]},${color[2]},1)`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, r*0.6, 0, Math.PI*2);
      ctx.stroke();
      // Mechanical detail
      ctx.strokeStyle = `rgba(${color[0]},${color[1]},${color[2]},0.5)`;
      ctx.lineWidth = 1;
      for (let i = 0; i < 8; i++) {
        const a = (i/8) * Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a)*r*0.3, y + Math.sin(a)*r*0.3);
        ctx.lineTo(x + Math.cos(a)*r*0.6, y + Math.sin(a)*r*0.6);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawFrameOverlay(ctx, spec, w, h) {
      ctx.save();
      ctx.globalAlpha = 0.3;
      const [r,g,b] = spec.primary;

      if (spec.type === 'Manifestor') {
        // Angular plates
        ctx.strokeStyle = `rgba(${r},${g},${b},0.6)`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(w*0.2, h*0.3);
        ctx.lineTo(w*0.35, h*0.25);
        ctx.lineTo(w*0.3, h*0.4);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(w*0.8, h*0.3);
        ctx.lineTo(w*0.65, h*0.25);
        ctx.lineTo(w*0.7, h*0.4);
        ctx.stroke();
      } else if (spec.type === 'Projector') {
        // Sensor rings
        ctx.strokeStyle = `rgba(${r},${g},${b},0.4)`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(w/2, h/2, w*0.3, 0, Math.PI*2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(w/2, h/2, w*0.35, 0, Math.PI*2);
        ctx.stroke();
      } else if (spec.type === 'Reflector') {
        // Mirror segments
        ctx.fillStyle = `rgba(${r},${g},${b},0.1)`;
        for (let i = 0; i < 6; i++) {
          const a1 = (i/6) * Math.PI*2;
          const a2 = ((i+1)/6) * Math.PI*2;
          ctx.beginPath();
          ctx.moveTo(w/2, h/2);
          ctx.arc(w/2, h/2, w*0.4, a1, a2);
          ctx.closePath();
          ctx.fill();
        }
      }
      ctx.restore();
    }

    function renderSpec(spec) {
      const out = document.getElementById('specOutput');
      const authData = AUTH_PALETTE[spec.authority];

      let html = '';

      html += `<div class="hd-spec-item">
        <span class="hd-spec-label">ARCHETYPE</span> ${spec.archetype}<br>
        <span class="hd-spec-label">FACTION</span> ${spec.faction}<br>
        <span class="hd-spec-label">THREAT</span> ${'█'.repeat(spec.threat)}${'░'.repeat(10-spec.threat)} ${spec.threat}/10
      </div>`;

      html += `<div class="hd-spec-item">
        <span class="hd-spec-label">STANCE</span> ${spec.stance}<br>
        <span class="hd-spec-label">POSE</span> ${spec.pose}<br>
        <span class="hd-spec-label">DETAIL</span> Level ${spec.detail}/6
      </div>`;

      html += `<div class="hd-spec-item">
        <span class="hd-spec-label">PALETTE</span><br>
        <div class="hd-palette">
          <div class="hd-color-swatch" style="background: rgb(${spec.primary[0]},${spec.primary[1]},${spec.primary[2]})"></div>
          <div class="hd-color-swatch" style="background: rgb(${spec.secondary[0]},${spec.secondary[1]},${spec.secondary[2]})"></div>
          <div class="hd-color-swatch" style="background: rgb(${spec.glow[0]},${spec.glow[1]},${spec.glow[2]}); box-shadow: 0 0 10px rgb(${spec.glow[0]},${spec.glow[1]},${spec.glow[2]})"></div>
        </div>
        <span style="color: #666; font-size: 10px;">Primary → Secondary → Authority Glow (${spec.pulse})</span>
      </div>`;

      html += `<div class="hd-spec-item">
        <span class="hd-spec-label">DEFINED</span> <span class="hd-zone-defined">${spec.defined.join(', ')}</span><br>
        <span class="hd-spec-label">OPEN</span> <span class="hd-zone-open">${spec.undefined.join(', ')}</span>
      </div>`;

      html += `<div class="hd-spec-item">
        <span class="hd-spec-label">IMPLANTS</span><br>`;
      for (const g of spec.gates) {
        const gd = GATE_MAP[g.number];
        if (gd) {
          const circuit = GATE_CIRCUIT[g.number] || 'Individual';
          html += `<span class="hd-implant">G${g.number} ${gd.name} (L${g.line}) [${circuit}]</span>`;
        }
      }
      html += `</div>`;

      html += `<div class="hd-narrative">
        <strong>${spec.cross}</strong><br>
        ${TYPE_ARCHETYPE[spec.type].desc}<br><br>
        Defined systems are cybernetically integrated — stable, always-on. 
        Open systems remain organic — exposed wiring, receptive, vulnerable to conditioning. 
        The character's power comes from what is defined. Their wisdom comes from what is open.
      </div>`;

      out.innerHTML = html;
    }

    function loadPreset(name) {
      if (name === 'manifestor') {
        document.getElementById('hdType').value = 'Manifestor';
        document.getElementById('hdProfile').value = '1_4';
        document.getElementById('hdAuthority').value = 'Emotional';
        document.getElementById('hdGates').value = '6.4, 12.1, 22.3, 36.2, 37.5, 49.6';
        document.getElementById('hdCross').value = 'Cross of Eden';
        document.querySelectorAll('#centerToggles .hd-gate').forEach(b => {
          b.classList.toggle('active', ['Heart','Throat','Head','Ajna','Root'].includes(b.dataset.center));
        });
      } else if (name === 'projector') {
        document.getElementById('hdType').value = 'Projector';
        document.getElementById('hdProfile').value = '5_1';
        document.getElementById('hdAuthority').value = 'Splenic';
        document.getElementById('hdGates').value = '11.5, 17.2, 43.1, 62.4';
        document.getElementById('hdCross').value = 'Cross of the Sphinx';
        document.querySelectorAll('#centerToggles .hd-gate').forEach(b => {
          b.classList.toggle('active', ['Ajna','Throat','G'].includes(b.dataset.center));
        });
      }
      generateMorph();
    }

    function downloadImage() {
      const canvas = document.getElementById('morphCanvas');
      const link = document.createElement('a');
      link.download = `hd_cyber_morph_${Date.now()}.png`;
      link.href = canvas.toDataURL();
      link.click();
    }

    function downloadSpec() {
      if (!currentSpec) return;
      const blob = new Blob([JSON.stringify(currentSpec, null, 2)], {type: 'application/json'});
      const link = document.createElement('a');
      link.download = `hd_cyber_spec_${Date.now()}.json`;
      link.href = URL.createObjectURL(blob);
      link.click();
    }

    // Initialize with default
    loadPreset('manifestor');
  </script>
</div>
