<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text swarm morph</title><style>body{margin:0;background:#100b24;color:#fff;font:16px system-ui}header{padding:20px;display:flex;gap:12px;flex-wrap:wrap}textarea{width:100%;height:70px}button,select{font:inherit;padding:10px}main{height:75vh}p{padding:0 20px}</style><header><textarea aria-label="Composition text">I design a world where every letter holds its place. I remember, I define, I am.</textarea><select aria-label="Requested form"><option>chair</option><option>text</option><option>house</option><option>person</option><option>body</option><option>world</option><option>page</option></select><button>Become</button><label><input type="checkbox" id="word-filter"> Reveal words</label></header><p>Opaque word compositions build the scene. Reveal words to inspect its substrate.</p><main></main><script type="module">
import {SymbolCompositionGraph} from '../overlay/components/organism/integration/SymbolCompositionGraph.mjs';
import {SwarmMorphView} from '../overlay/components/organism/browser/SwarmMorphView.mjs';
let view,composition,text,serial=0;
function become(){const input=document.querySelector('textarea').value;if(!input.trim())return;if(input!==text){view?.stop();text=input;const graph=new SymbolCompositionGraph();const ids=Array.from(input).map((symbol,i)=>{const id=`text-${++serial}-${i}`;graph.occurrence({id,symbol,provenance:['demo:user-text']});return id;});composition=graph.compose(ids);view=new SwarmMorphView({root:document.querySelector('main'),graph});view.revealWords=document.querySelector('#word-filter').checked;}view.morph({compositionId:composition.id,form:document.querySelector('select').value});}
document.querySelector('#word-filter').addEventListener('change',e=>view?.setWordFilter(e.target.checked));
document.querySelector('button').addEventListener('click',become);document.querySelector('select').addEventListener('change',become);become();
</script></html>
