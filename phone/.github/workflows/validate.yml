name: Validate integrated app
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi httpx pytest tzdata
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm ci --ignore-scripts
        working-directory: runtimes/isohuman
      - run: npm run build
        working-directory: runtimes/isohuman
      - run: node scripts/test-chart-game.mjs
      - run: python -m pytest tests/test_birth_anchor.py tests/test_local_model.py tests/test_research_registry.py tests/test_integrated_questions.py tests/test_geonatal.py tests/test_contact_loop.py tests/test_being_state.py -q
